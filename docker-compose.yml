name: ai-devops-saas

# Build contexts are the *monorepo root* so the api/worker images can
# COPY shared/ alongside their own packages. Volume mounts give us
# fast hot-reload without rebuilding the image.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
      BACKEND_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
      CORS_ORIGINS: '["http://localhost:5173"]'
      ENV: dev
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source for hot-reload. shared/ is mounted so changes there
      # also reload uvicorn (it picks up everything under /install/lib).
      - ./backend/app:/app/app
      - ./shared/alembic:/app/alembic
      - ./shared/shared:/install/lib/python3.12/site-packages/shared
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
      ENV: dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./worker/worker:/install/lib/python3.12/site-packages/worker
      - ./shared/shared:/install/lib/python3.12/site-packages/shared
      # Mount the host docker socket so the worker can `docker build` user apps
      # in dev. In prod this is replaced by remote-build via Buildx + BuildKit.
      - /var/run/docker.sock:/var/run/docker.sock
    # In dev we run all queues in one process for simplicity.
    command: >
      celery -A worker.celery_app:app worker
        -Q analyzer,dockergen,builder,deployer
        --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on:
      - api

volumes:
  db_data:
