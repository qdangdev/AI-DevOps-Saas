[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-devops-saas-shared"
version = "0.1.0"
description = "Shared code: models, schemas, services, config — used by backend and worker."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic[email]>=2.6",          # EmailStr validator
    "pydantic-settings>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "bcrypt>=4.1",                   # password hashing
    "cryptography>=42.0",
    "structlog>=24.1",
    "anthropic>=0.25",
    "boto3>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["shared"]
