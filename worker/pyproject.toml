[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-devops-saas-worker"
version = "0.1.0"
description = "Celery workers for analyze, dockergen, build, deploy."
requires-python = ">=3.12"
dependencies = [
    # shared/ is installed in the same image; not listed as a normal dep so it's
    # always installed editable via `pip install -e ../shared` ahead of this.
    "celery[redis]>=5.3",
    "redis>=5.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["worker"]
