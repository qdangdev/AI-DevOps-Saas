[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-devops-saas-backend"
version = "0.1.0"
description = "FastAPI HTTP API. Imports from `shared` (installed as a sibling package)."
requires-python = ">=3.12"
dependencies = [
    # shared is installed editable from ../shared in dev and via COPY+pip in Docker.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "celery[redis]>=5.3",   # to call .delay() on worker tasks; not running workers
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
